<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title><script src="navigation.js" defer></script>
</title><style>body{font:18px Arial;text-align:center;background:#fdf6ec;margin:0;padding:16px;color:#333}h1{color:#4a90d9}a{display:inline-block;margin:4px;padding:9px 14px;border-radius:18px;background:#ff6f61;color:#fff;text-decoration:none;font-weight:bold}button{margin:4px;padding:9px 14px;border:0;border-radius:18px;background:#4a90d9;color:#fff;font-weight:bold}.pick{background:#fff;color:#4a90d9;border:2px solid #4a90d9}.pick.active{background:#4a90d9;color:#fff}#stage{max-width:420px;margin:14px auto;padding:18px;background:#fff;border-radius:20px;box-shadow:0 3px 10px #0002}#monster{font-size:90px}#health{height:20px;background:#eee;border-radius:10px;overflow:hidden}#bar{height:100%;width:100%;background:#4caf50}#q{font-size:40px;font-weight:bold;margin:15px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:320px;margin:auto}.ans{font-size:26px;padding:14px}#msg{min-height:30px;font-size:22px;font-weight:bold;color:#4caf50}</style><h1>👹 Mathe Monster</h1><nav>
  <a href="index.html">✏️ Buchstaben</a>
  <a href="memory.html">🧠 Memory</a>
  <a href="mathe_monster.html">👹 Mathe Monster</a>
</nav><div><button class="pick active" data-l="easy">Leicht 1–5</button><button class="pick" data-l="medium">Mittel 1–10</button><button class="pick" data-l="hard">Schwer 1–20</button></div><div><button class="pick active" data-o="add">➕ Plus</button><button class="pick" data-o="sub">➖ Minus</button><button class="pick" data-o="mix">🔀 Gemischt</button></div><div id="stage"><div id="hearts">❤️❤️❤️</div><div id="monster">👹</div><div id="health"><div id="bar"></div></div><div id="q"></div><div class="answers" id="answers"></div></div><div id="score">🏆 Besiegt: <b>0</b></div><div id="msg"></div><script>const mobs=['👹','👾','🐲','👺','🧟','🐙','👻','🦖'];let level='easy',op='add',lives=3,hp=100,wins=0,answer=0,locked=false;const q=document.querySelector('#q'),A=document.querySelector('#answers'),H=document.querySelector('#hearts'),B=document.querySelector('#bar'),M=document.querySelector('#monster'),msg=document.querySelector('#msg');function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}function range(){return level==='easy'?5:level==='medium'?10:20}function hearts(){H.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}function question(){let a=rnd(1,range()),b=rnd(1,range()),o=op==='mix'?(Math.random()<.5?'add':'sub'):op;if(o==='sub'&&b>a)[a,b]=[b,a];answer=o==='add'?a+b:a-b;q.textContent=a+(o==='add'?' + ':' - ')+b+' = ?';let s=new Set([answer]);while(s.size<4){let x=answer+rnd(-4,4);if(x>=0)s.add(x)}A.innerHTML='';[...s].sort(()=>Math.random()-.5).forEach(x=>{let b=document.createElement('button');b.className='ans';b.textContent=x;b.onclick=()=>pick(x,b);A.append(b)})}function resetMonster(){M.textContent=mobs[rnd(0,mobs.length-1)];hp=100;B.style.width='100%';B.style.background='#4caf50'}function pick(x,b){if(locked)return;locked=true;if(x===answer){b.style.background='#4caf50';hp-=25;B.style.width=hp+'%';if(hp<=60)B.style.background='#f4c430';if(hp<=30)B.style.background='#e57373';if(hp<=0){wins++;document.querySelector('#score b').textContent=wins;msg.textContent='🌟 Monster besiegt!';setTimeout(()=>{msg.textContent='';resetMonster();question();locked=false},900);return}}else{b.style.background='#e57373';lives--;hearts();if(lives<=0){msg.textContent='😢 Versuch es nochmal!';setTimeout(()=>{lives=3;hearts();msg.textContent='';resetMonster();question();locked=false},1000);return}}setTimeout(()=>{question();locked=false},450)}document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=b.dataset.l;question()});document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-o]').forEach(x=>x.classList.remove('active'));b.classList.add('active');op=b.dataset.o;question()});hearts();resetMonster();question();</script></html>
