<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title><script src="navigation.js" defer></script></title><style>body{font:18px Arial;text-align:center;background:#fdf6ec;margin:0;padding:16px}button{margin:4px;padding:10px 14px;border:0;border-radius:18px;background:#4a90d9;color:white;font-weight:bold}#letters{max-width:700px;margin:10px auto}#letters button{width:38px;background:white;color:#333}#letters .done{background:#4caf50;color:white}#board{position:relative;margin:10px auto;width:min(90vw,420px);height:min(90vw,420px);background:white;border-radius:20px}canvas{position:absolute;inset:0;width:100%;height:100%}#card{display:none;background:white;border-radius:20px;margin:10px auto;padding:20px;width:min(90vw,380px)}#pic{font-size:90px}#word{font-size:30px;color:#4a90d9;font-weight:bold}#msg{height:30px;font-size:22px;font-weight:bold}#nav a{display:inline-block;margin:4px;padding:9px 16px;border-radius:18px;background:#ff6f61;color:white;font-weight:bold;text-decoration:none}</style><h1>✏️ Buchstaben lernen</h1><div id="nav"><a href="memory.html">🧠 Memory Spiel</a></div><div><button data-lang="en">English</button><button data-lang="de">Deutsch</button><button data-lang="fr">Français</button></div><div><button data-mode="upper">ABC</button><button data-mode="lower">abc</button><button data-mode="words">🖼️ Wörter</button></div><div id="letters"></div><div id="board"><canvas id="guide"></canvas><canvas id="draw"></canvas></div><div id="card"><div id="pic"></div><div id="word"></div></div><button id="speak">🔊 Anhören</button><button id="clear">🧹 Löschen</button><button id="check">✅ Prüfen</button><div id="msg"></div><small id="status"></small><script>const sets={en:['English','en-US','ABCDEFGHIJKLMNOPQRSTUVWXYZ'],de:['Deutsch','de-CH','ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜẞ'],fr:['Français','fr-CH','ABCDEFGHIJKLMNOPQRSTUVWXYZ']},words={en:{A:['Apple','🍎'],B:['Ball','⚽'],C:['Cat','🐱'],D:['Dog','🐶'],E:['Elephant','🐘'],F:['Fish','🐟'],G:['Grapes','🍇'],H:['House','🏠'],I:['Ice cream','🍦'],J:['Juice','🧃'],K:['Kite','🪁'],L:['Lion','🦁'],M:['Moon','🌙'],N:['Nest','🪺'],O:['Orange','🍊'],P:['Pig','🐷'],Q:['Queen','👑'],R:['Rainbow','🌈'],S:['Sun','☀️'],T:['Tree','🌳'],U:['Umbrella','☂️'],V:['Violin','🎻'],W:['Watermelon','🍉'],X:['Xylophone','🎼'],Y:['Yo-yo','🪀'],Z:['Zebra','🦓']},de:{A:['Apfel','🍎'],B:['Ball','⚽'],C:['Clown','🤡'],D:['Dach','🏠'],E:['Elefant','🐘'],F:['Fisch','🐟'],G:['Giraffe','🦒'],H:['Hund','🐶'],I:['Igel','🦔'],J:['Junge','👦'],K:['Katze','🐱'],L:['Löwe','🦁'],M:['Maus','🐭'],N:['Nase','👃'],O:['Orange','🍊'],P:['Pferd','🐴'],Q:['Qualle','🪼'],R:['Regenbogen','🌈'],S:['Sonne','☀️'],T:['Tiger','🐯'],U:['Uhr','⏰'],V:['Vogel','🐦'],W:['Wasser','💧'],X:['Xylophon','🎼'],Y:['Yoga','🧘'],Z:['Zebra','🦓'],Ä:['Ähre','🌾'],Ö:['Öl','🛢️'],Ü:['Übung','📝'],ẞ:['Eszett','🔤']},fr:{A:['Avion','✈️'],B:['Banane','🍌'],C:['Chat','🐱'],D:['Dragon','🐉'],E:['École','🏫'],F:['Fleur','🌸'],G:['Gâteau','🎂'],H:['Hibou','🦉'],I:['Île','🏝️'],J:['Jouet','🧸'],K:['Kiwi','🥝'],L:['Lion','🦁'],M:['Maison','🏠'],N:['Nuage','☁️'],O:['Ours','🐻'],P:['Poisson','🐟'],Q:['Quiche','🥧'],R:['Renard','🦊'],S:['Soleil','☀️'],T:['Tortue','🐢'],U:['Uniforme','👔'],V:['Voiture','🚗'],W:['Wagon','🚃'],X:['Xylophone','🎼'],Y:['Yaourt','🍦'],Z:['Zèbre','🦓']}};let lang='de',mode='upper',i=0,p=JSON.parse(localStorage.lt||'{}'),G=document.querySelector('#guide'),D=document.querySelector('#draw'),g=G.getContext('2d'),d=D.getContext('2d'),L=document.querySelector('#letters'),card=document.querySelector('#card'),pic=document.querySelector('#pic'),word=document.querySelector('#word'),msg=document.querySelector('#msg'),status=document.querySelector('#status');function letters(){return sets[lang][2].split('')}function letter(){return letters()[i]}function shown(){return mode==='lower'?letter().toLocaleLowerCase('de-CH'):letter()}function key(n=i){return lang+'-'+mode+'-'+letters()[n]}function drawGuide(){let n=G.clientWidth;g.clearRect(0,0,n,n);g.font='bold '+n*.7+'px Arial';g.textAlign='center';g.textBaseline='middle';g.setLineDash([6,6]);g.strokeStyle='#bbb';g.lineWidth=2;g.strokeText(shown(),n/2,n/2);g.setLineDash([])}function resize(){let n=document.querySelector('#board').clientWidth;[G,D].forEach(c=>{c.width=n*2;c.height=n*2});g.setTransform(2,0,0,2,0,0);d.setTransform(2,0,0,2,0,0);d.lineWidth=14;d.lineCap='round';d.strokeStyle='#ff6f61';drawGuide()}function render(){L.innerHTML='';letters().forEach((x,n)=>{let b=document.createElement('button');b.textContent=mode==='lower'?x.toLocaleLowerCase('de-CH'):x;if(p[key(n)])b.className='done';b.onclick=()=>{i=n;render()};L.append(b)});status.textContent=letters().filter((_,n)=>p[key(n)]).length+' / '+letters().length+' '+sets[lang][0];msg.textContent='';if(mode==='words'){document.querySelector('#board').style.display='none';card.style.display='block';let w=words[lang][letter()]||['?','❓'];pic.textContent=w[1];word.textContent=w[0];document.querySelector('#clear').style.display='none'}else{document.querySelector('#board').style.display='block';card.style.display='none';document.querySelector('#clear').style.display='inline-block';d.clearRect(0,0,D.clientWidth,D.clientHeight);drawGuide()}}function speak(){let t=mode==='words'?(words[lang][letter()]||['?'])[0]:shown(),u=new SpeechSynthesisUtterance(t);u.lang=sets[lang][1];u.rate=.7;speechSynthesis.cancel();speechSynthesis.speak(u)}let down=false;function pos(e){let r=D.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return{x:q.clientX-r.left,y:q.clientY-r.top}}D.onmousedown=D.ontouchstart=e=>{down=true;let q=pos(e);d.beginPath();d.moveTo(q.x,q.y);e.preventDefault()};D.onmousemove=D.ontouchmove=e=>{if(!down)return;let q=pos(e);d.lineTo(q.x,q.y);d.stroke();e.preventDefault()};D.onmouseup=D.onmouseleave=D.ontouchend=()=>down=false;function score(){let x=d.getImageData(0,0,D.width,D.height).data,y=g.getImageData(0,0,G.width,G.height).data,n=0,o=0;for(let j=0;j<x.length;j+=4){if(x[j+3]>10)n++;if(x[j+3]>10&&y[j+3]>10)o++}return n?o/n:0}document.querySelector('#speak').onclick=speak;document.querySelector('#clear').onclick=()=>{d.clearRect(0,0,D.clientWidth,D.clientHeight);msg.textContent=''};document.querySelector('#check').onclick=()=>{if(mode==='words'||score()>.08){p[key()]=1;localStorage.lt=JSON.stringify(p);msg.textContent=lang==='de'?'🌟 Sehr gut!':lang==='fr'?'🌟 Bravo!':'🌟 Great job!';speak();setTimeout(()=>{i=(i+1)%letters().length;render()},700)}else msg.textContent=lang==='de'?'Über die Punkte fahren 🙂':lang==='fr'?'Repasse sur les pointillés 🙂':'Trace over the dots 🙂'};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;i=0;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;i=0;render()});onresize=resize;resize();render();</script></html>
