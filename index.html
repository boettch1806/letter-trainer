<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Letter Trainer</title><style>body{margin:0;padding:16px;text-align:center;font:18px Arial;background:#fdf6ec;color:#333}button{margin:4px;padding:10px 14px;border:0;border-radius:18px;background:#4a90d9;color:#fff;font-weight:bold}#letters{max-width:700px;margin:10px auto}#letters button{width:38px;padding:10px 0;background:#fff;color:#333;box-shadow:0 2px 4px #999}#letters .done{background:#4caf50;color:#fff}#board{position:relative;margin:10px auto;width:min(90vw,420px);height:min(90vw,420px);background:#fff;border-radius:20px;box-shadow:0 3px 10px #aaa}canvas{position:absolute;inset:0;width:100%;height:100%}#msg{height:30px;font-size:22px;font-weight:bold}</style><h1>✏️ Buchstaben lernen</h1><div id="langs"><button data-l="en">English</button><button data-l="de">Deutsch</button><button data-l="fr">Français</button></div><div><button data-m="upper">ABC</button><button data-m="lower">abc</button></div><div id="letters"></div><div id="board"><canvas id="guide"></canvas><canvas id="draw"></canvas></div><button id="say">🔊 Anhören</button><button id="clear">🧹 Löschen</button><button id="check">✅ Prüfen</button><div id="msg"></div><small id="status"></small><script>const sets={en:['English','en-US','ABCDEFGHIJKLMNOPQRSTUVWXYZ'],de:['Deutsch','de-CH','ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜẞ'],fr:['Français','fr-CH','ABCDEFGHIJKLMNOPQRSTUVWXYZ']};let lang='en',mode='upper',i=0,p=JSON.parse(localStorage.lt||'{}');const G=document.querySelector('#guide'),D=document.querySelector('#draw'),g=G.getContext('2d'),d=D.getContext('2d'),L=document.querySelector('#letters'),M=document.querySelector('#msg'),S=document.querySelector('#status');function a(){return sets[lang][2].split('')}function ch(){return(mode==='upper'?a()[i]:a()[i].toLocaleLowerCase('de-CH'))}function k(n=i){return lang+'-'+mode+'-'+a()[n]}function size(){let n=document.querySelector('#board').clientWidth;[G,D].forEach(x=>{x.width=n*2;x.height=n*2});g.setTransform(2,0,0,2,0,0);d.setTransform(2,0,0,2,0,0);d.lineWidth=14;d.lineCap='round';d.strokeStyle='#ff6f61';guide()}function guide(){let n=G.clientWidth;g.clearRect(0,0,n,n);g.font='bold '+n*.7+'px Arial';g.textAlign='center';g.textBaseline='middle';g.setLineDash([6,6]);g.strokeStyle='#bbb';g.lineWidth=2;g.strokeText(ch(),n/2,n/2);g.setLineDash([]);g.fillStyle='#eaf3fb';g.fillText(ch(),n/2,n/2)}function redraw(){L.innerHTML='';a().forEach((x,n)=>{let b=document.createElement('button');b.textContent=mode==='upper'?x:x.toLocaleLowerCase('de-CH');if(p[k(n)])b.className='done';b.onclick=()=>{i=n;refresh()};L.append(b)});S.textContent=a().filter((_,n)=>p[k(n)]).length+' / '+a().length+' '+sets[lang][0];d.clearRect(0,0,D.clientWidth,D.clientHeight);M.textContent='';guide()}function refresh(){redraw()}function speak(){let u=new SpeechSynthesisUtterance(ch());u.lang=sets[lang][1];u.rate=.7;speechSynthesis.cancel();speechSynthesis.speak(u)}let down=false;function xy(e){let r=D.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return{x:q.clientX-r.left,y:q.clientY-r.top}}D.onmousedown=D.ontouchstart=e=>{down=true;let q=xy(e);d.beginPath();d.moveTo(q.x,q.y);e.preventDefault()};D.onmousemove=D.ontouchmove=e=>{if(!down)return;let q=xy(e);d.lineTo(q.x,q.y);d.stroke();e.preventDefault()};D.onmouseup=D.onmouseleave=D.ontouchend=()=>down=false;function score(){let x=d.getImageData(0,0,D.width,D.height).data,y=g.getImageData(0,0,G.width,G.height).data,n=0,o=0;for(let j=0;j<x.length;j+=4){if(x[j+3]>10)n++;if(x[j+3]>10&&y[j+3]>10)o++}return n?o/n:0}document.querySelector('#say').onclick=speak;document.querySelector('#clear').onclick=()=>{d.clearRect(0,0,D.clientWidth,D.clientHeight);M.textContent=''};document.querySelector('#check').onclick=()=>{if(score()>.08){p[k()]=1;localStorage.lt=JSON.stringify(p);M.textContent=lang==='de'?'🌟 Sehr gut!':lang==='fr'?'🌟 Bravo!':'🌟 Great job!';speak();setTimeout(()=>{i=(i+1)%a().length;refresh()},900)}else M.textContent=lang==='de'?'Bitte über die Punkte fahren 🙂':lang==='fr'?'Repasse sur les pointillés 🙂':'Trace over the dots 🙂';redraw()};document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;i=0;refresh()});document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;refresh()});onresize=size;size();refresh();</script></html>
