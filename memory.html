<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Spiel</title><style>body{font:18px Arial;text-align:center;background:#fdf6ec;margin:0;padding:16px;color:#333}h1{color:#4a90d9;margin:4px}button{margin:4px;padding:9px 16px;border:0;border-radius:18px;background:#4a90d9;color:#fff;font-weight:bold;cursor:pointer}.pick{background:#fff;color:#4a90d9;border:2px solid #4a90d9}.pick.active{background:#4a90d9;color:#fff}#top{display:flex;justify-content:center;gap:12px;margin:8px}#top span{background:#fff;padding:6px 12px;border-radius:16px}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:14px auto}.card{width:80px;height:80px;background:#4a90d9;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer;box-shadow:0 3px 6px #0003}.card.open{background:#fff}.card.matched{background:#c9f7d1;cursor:default}#msg{font-size:23px;font-weight:bold;color:#4caf50;min-height:32px}@media(max-width:480px){.card{width:64px;height:64px;font-size:30px}}</style><h1>🧠 Memory Spiel</h1><div id="themes"><button class="pick active" data-t="tiere">🐾 Tiere</button><button class="pick" data-t="obst">🍎 Obst</button><button class="pick" data-t="fahrzeuge">🚗 Fahrzeuge</button></div><div id="levels"><button class="pick" data-n="4">Leicht</button><button class="pick active" data-n="6">Mittel</button><button class="pick" data-n="8">Schwer</button></div><div id="top"><span>🎯 Züge: <b id="moves">0</b></span><span>⏱️ Zeit: <b id="time">0</b>s</span></div><div id="grid"></div><div id="msg"></div><button id="new">🔄 Neu starten</button><script>const sets={tiere:['🐶','🐱','🐭','🐹','🦁','🐸','🐵','🐔'],obst:['🍎','🍌','🍇','🍊','🍓','🍍','🍉','🥝'],fahrzeuge:['🚗','🚕','🚓','🚑','🚒','🚜','🚌','🚂']};let theme='tiere',pairs=6,cards=[],open=[],moves=0,matched=0,seconds=0,timer,locked=false;const grid=document.querySelector('#grid'),msg=document.querySelector('#msg');function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){clearInterval(timer);moves=matched=seconds=0;open=[];locked=false;msg.textContent='';document.querySelector('#moves').textContent=0;document.querySelector('#time').textContent=0;let a=shuffle(sets[theme].slice()).slice(0,pairs);cards=shuffle(a.concat(a)).map((emoji,id)=>({emoji,id,open:false,matched:false}));grid.innerHTML='';grid.style.gridTemplateColumns='repeat(4,1fr)';cards.forEach(c=>{let b=document.createElement('div');b.className='card';b.textContent='❓';b.onclick=()=>flip(c,b);grid.append(b)});timer=setInterval(()=>document.querySelector('#time').textContent=++seconds,1000)}function flip(c,b){if(locked||c.open||c.matched)return;c.open=true;b.classList.add('open');b.textContent=c.emoji;open.push([c,b]);if(open.length<2)return;moves++;document.querySelector('#moves').textContent=moves;locked=true;let[a,x]=open,[z,y]=open;if(a.emoji===z.emoji){a.matched=z.matched=true;x.classList.add('matched');y.classList.add('matched');open=[];locked=false;if(++matched===pairs){clearInterval(timer);msg.textContent='🌟 Super! Alle Paare gefunden!'}}else setTimeout(()=>{a.open=z.open=false;x.classList.remove('open');y.classList.remove('open');x.textContent=y.textContent='❓';open=[];locked=false},700)}document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('active'));b.classList.add('active');theme=b.dataset.t;start()});document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-n]').forEach(x=>x.classList.remove('active'));b.classList.add('active');pairs=+b.dataset.n;start()});document.querySelector('#new').onclick=start;start();</script></html>
